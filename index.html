<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>距离自由还有…</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #7d8590;
    --accent: #3fb950;
    --accent-dim: #1f6f34;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  .label {
    font-size: 14px;
    letter-spacing: 0.35em;
    color: var(--muted);
    text-indent: 0.35em;
    margin-bottom: 28px;
  }

  .days {
    font-size: clamp(96px, 26vw, 220px);
    font-weight: 200;
    line-height: 0.9;
    letter-spacing: -0.04em;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 0 60px rgba(63, 185, 80, 0.25);
  }

  .unit {
    font-size: clamp(16px, 4vw, 24px);
    color: var(--muted);
    letter-spacing: 0.5em;
    text-indent: 0.5em;
    margin-top: 12px;
  }

  .breakdown {
    margin-top: 56px;
    display: flex;
    gap: clamp(20px, 6vw, 56px);
    flex-wrap: wrap;
    justify-content: center;
  }
  .item { text-align: center; }
  .item .num {
    font-size: clamp(22px, 5vw, 32px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
  }
  .item .cap {
    font-size: 12px;
    color: var(--muted);
    margin-top: 6px;
    letter-spacing: 0.1em;
  }

  .target {
    margin-top: 64px;
    font-size: 13px;
    color: var(--muted);
    line-height: 2;
  }

  /* ── Milestones ── */
  #milestones {
    margin-top: 48px;
    width: 100%;
    max-width: 520px;
  }
  #milestones h3 {
    font-size: 11px;
    letter-spacing: 0.35em;
    text-indent: 0.35em;
    color: var(--muted);
    text-align: center;
    margin-bottom: 16px;
    font-weight: normal;
  }
  .ms {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid #161b22;
    font-size: 13px;
  }
  .ms:last-child { border-bottom: none; }
  .ms .ms-date { color: var(--muted); font-size: 12px; }
  .ms .ms-name { flex: 1; padding: 0 14px; }
  .ms .ms-done { color: var(--accent); }
  .ms .ms-left { color: var(--fg); font-variant-numeric: tabular-nums; }
  .ms.pass { opacity: 0.4; }
  .ms.special .ms-name { color: var(--accent); font-weight: 500; }
  .ms.special .ms-left { color: var(--accent); }

  .done .days { color: var(--fg); text-shadow: none; }
  .done .label::after { content: " · 已抵达"; color: var(--accent); }
</style>
</head>
<body>
  <div class="label">距离自由</div>
  <div class="days" id="days">--</div>
  <div class="unit">天</div>

  <div class="breakdown">
    <div class="item"><div class="num" id="weeks">--</div><div class="cap">周</div></div>
    <div class="item"><div class="num" id="workdays">--</div><div class="cap">工作日</div></div>
    <div class="item"><div class="num" id="hours">--</div><div class="cap">小时</div></div>
  </div>

  <div class="target">
    2027.01.29<br />
    <span id="quote">再坚持一下，你已经在路上了。</span>
  </div>

  <div id="milestones"><h3>路上的站</h3></div>

<script>
  const TARGET = new Date(2027, 0, 29, 0, 0, 0); // 2027-01-29

  // 里程碑列表 [{date, name, special}]
  const MILESTONES = [
    { date: "2026-11-11", name: "双十一 · 买点好的给自己", special: false },
    { date: "2026-12-01", name: "最后 60 天", special: true },
    { date: "2026-12-25", name: "圣诞节 · 一年又要结束了", special: false },
    { date: "2027-01-01", name: "元旦 · 新年第一天，也是解脱倒计时", special: true },
    { date: "2027-01-14", name: "最后一个工作日？", special: false },
  ];

  const QUOTES = [
    "再坚持一下，你已经在路上了。",
    "今天过完，又少一天。",
    "不用努力学，撑住就行。",
    "你不是不行，只是被榨干了。",
    "刷手机也是在休息，不内疚。",
    "每一天都在靠近自由。",
    "撑过去，然后重新开始。",
    "12 万在，你输得起。",
  ];

  const el = id => document.getElementById(id);

  function parseDate(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }

  function countWorkdays(from, to) {
    let days = Math.max(0, Math.ceil((to - from) / 86400000));
    let workdays = 0;
    for (let i = 0; i < days; i++) {
      const day = new Date(from.getTime() + i * 86400000);
      const w = day.getDay();
      if (w !== 0 && w !== 6) workdays++;
    }
    return workdays;
  }

  function fmt(date) {
    return `${date.getMonth() + 1}月${date.getDate()}日`;
  }

  function buildMilestones(now) {
    const container = el("milestones");
    // rebuild each tick (lightweight)
    const h3 = "<h3>路上的站</h3>";
    let rows = MILESTONES.map(ms => {
      const md = parseDate(ms.date);
      md.setHours(0, 0, 0, 0);
      const diff = Math.round((md - now) / 86400000);
      const passed = diff < 0;
      const cls = (passed ? "ms pass" : "ms") + (ms.special && !passed ? " special" : "");
      const dateStr = `${md.getMonth() + 1}/${md.getDate()}`;
      const nameHtml = ms.name;
      let numHtml;
      if (diff === 0) numHtml = `<span class="ms-done">就是今天</span>`;
      else if (diff < 0) numHtml = `<span class="ms-left">${Math.abs(diff)}天前</span>`;
      else numHtml = `<span class="ms-left">${diff}天</span>`;
      return `<div class="${cls}"><span class="ms-date">${dateStr}</span><span class="ms-name">${nameHtml}</span>${numHtml}</div>`;
    }).join("");

    // 总进度条（从今天到终点）
    const totalDays = Math.round((TARGET - parseDate("2026-10-21")) / 86400000);
    const elapsed = Math.round((now - parseDate("2026-10-21")) / 86400000);
    const pct = Math.min(100, Math.max(0, Math.round((elapsed / totalDays) * 100)));

    const progressHtml = `
      <div style="margin-top:24px;padding-top:20px;border-top:1px solid #161b22">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:6px">
          <span>进度</span><span>${pct}%</span>
        </div>
        <div style="background:#161b22;height:4px;border-radius:2px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--accent);border-radius:2px;transition:width 1s ease"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px">
          <span>10月21日</span><span>1月29日</span>
        </div>
      </div>`;

    container.innerHTML = h3 + rows + progressHtml;
  }

  function tick() {
    const now = new Date();
    const left = TARGET - now;
    const done = left <= 0;

    const { days, workdays } = (() => {
      let days = Math.max(0, Math.ceil((TARGET - now) / 86400000));
      let workdays = 0;
      for (let i = 0; i < days; i++) {
        const d = new Date(now.getTime() + i * 86400000);
        if (d.getDay() !== 0 && d.getDay() !== 6) workdays++;
      }
      return { days, workdays };
    })();
    const hours = Math.max(0, Math.floor(left / 3600000));

    el("days").textContent = done ? "0" : days;
    el("weeks").textContent = Math.floor(days / 7);
    el("workdays").textContent = workdays;
    el("hours").textContent = hours > 999 ? (hours / 24).toFixed(0) + "d" : hours;

    document.body.classList.toggle("done", done);

    if (done) {
      el("quote").textContent = "你到了。";
    } else {
      const idx = Math.floor(now.getTime() / 86400000) % QUOTES.length;
      el("quote").textContent = QUOTES[idx];
    }

    buildMilestones(now);
  }

  tick();
  setInterval(tick, 1000);
</script>
